name: KKNX stock defconfig build

on:
  workflow_dispatch:
  push:
    branches:
      - rebase
    paths:
      - .github/workflows/kknx-stock-build.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout KKNX fork
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git \
            libelf-dev libssl-dev python3 wget xz-utils zstd

      - name: Run KKNX stock build commands
        run: |
          chmod +x prepare_compiler.sh clang.sh
          ./prepare_compiler.sh
          ./clang.sh blossom_stock_defconfig
          ./clang.sh Image.gz

      - name: Upload stock build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kknx-stock-build
          path: |
            out/.config
            out/arch/arm64/boot/Image.gz
          if-no-files-found: warn